<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start — блок целиком переписывает scripts/seo/build-seo.mjs на каждый
         маршрут при сборке. Правки внутри переживут только dev-сервер. -->
    <title>Denis Daragan Buro — ландшафтная архитектура</title>
    <meta name="description" content="Бюро ландшафтной архитектуры Дениса Дарагана: парки, частные резиденции, сады. Санкт-Петербург." />
    <link rel="canonical" href="https://denisdaragan.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Denis Daragan Buro" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Denis Daragan Buro — ландшафтная архитектура" />
    <meta property="og:description" content="Бюро ландшафтной архитектуры Дениса Дарагана: парки, частные резиденции, сады. Санкт-Петербург." />
    <meta property="og:url" content="https://denisdaragan.com/" />
    <meta property="og:image" content="https://denisdaragan.com/landscape/assets/share-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->
    <!-- Загрузочный экран редактора. Он лежит здесь, а не в React: браузер рисует
         его первым же кадром, до того как разобраны модули сцены. Флаг ставится
         только на маршруте редактора — сайт грузится как раньше.
         Обе анимации идут по transform, их ведёт композитор: сборка сцены надолго
         занимает главный поток, но подвиснуть им не может. Шкалы с процентами тут
         нет намеренно — ассеты догружаются к 1.6 с, а оставшиеся ~4.5 с уходят на
         построение сцены и компиляцию шейдеров, где измерять нечего. Полоса
         показывает, что работа идёт, и не врёт, будто знает сколько осталось. -->
    <script>
      if (/^\/(en\/)?home\/edit\/?$/.test(window.location.pathname)) {
        document.documentElement.dataset.engineBoot = 'loading';
      }
    </script>
    <style>
      #engine-boot { display: none; }

      html[data-engine-boot] { background: #17191a; overflow: hidden; }

      html[data-engine-boot] #engine-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 21px;
        background: #17191a;
        color: #dcddd8;
        font: 600 10px/12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 1.8px;
        cursor: progress;
        transition: opacity 0.5s ease;
      }

      html[data-engine-boot="ready"] #engine-boot {
        opacity: 0;
        pointer-events: none;
      }

      #engine-boot .engine-boot__mark {
        width: 74px;
        height: 74px;
        animation: engine-boot-spin 7s linear infinite;
      }

      #engine-boot .engine-boot__word { text-align: center; }
      #engine-boot small {
        display: block;
        margin-top: 5px;
        font-size: 7px;
        font-weight: 400;
        letter-spacing: 2px;
        color: #989d9e;
      }

      #engine-boot .engine-boot__status {
        display: grid;
        justify-items: center;
        gap: 11px;
      }

      /* Обе подписи лежат в кадре сразу и перекрещиваются CSS-анимацией, а не
         по событию загрузчика. Замер: ассеты заканчиваются к ~1.1 с, дальше
         главный поток на секунды уходит в построение сцены — и ни один
         setTimeout там не выполнится, подпись бы застряла на «Загрузке» почти
         до конца. Анимацию же ведёт композитор, она играет сквозь блокировку.
         Задержка подобрана по этому замеру; на очень холодном кеше подпись
         сменится чуть раньше, чем реально догрузится последний ассет. */
      #engine-boot .engine-boot__phase {
        position: relative;
        height: 9px;
      }
      #engine-boot .engine-boot__phase span {
        position: absolute;
        top: 0;
        left: 50%;
        transform: translateX(-50%);
        white-space: nowrap;
        font-size: 7px;
        font-weight: 400;
        letter-spacing: 2px;
        text-transform: uppercase;
        color: #989d9e;
      }
      #engine-boot .engine-boot__phase span[data-boot-phase="loading"] {
        animation: engine-boot-phase-out 0.5s ease 1.2s both;
      }
      #engine-boot .engine-boot__phase span[data-boot-phase="building"] {
        animation: engine-boot-phase-in 0.5s ease 1.2s both;
      }

      #engine-boot .engine-boot__bar {
        position: relative;
        width: 146px;
        height: 1px;
        overflow: hidden;
        background: #353839;
      }
      #engine-boot .engine-boot__bar i {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 40%;
        background: linear-gradient(90deg, transparent, #cfc1a1, transparent);
        animation: engine-boot-sweep 1.9s cubic-bezier(0.65, 0, 0.35, 1) infinite;
      }

      @keyframes engine-boot-spin { to { transform: rotate(360deg); } }
      @keyframes engine-boot-phase-out { from { opacity: 1; } to { opacity: 0; } }
      @keyframes engine-boot-phase-in { from { opacity: 0; } to { opacity: 1; } }
      @keyframes engine-boot-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(350%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #engine-boot .engine-boot__mark { animation: none; }
        #engine-boot .engine-boot__bar i { animation: none; opacity: 0.4; }
      }
    </style>
    <script>
      (function routeGitHubPagesFallback(location) {
        if (!location.search.startsWith('?/')) {
          return;
        }

        const decoded = location.search
          .slice(2)
          .split('&')
          .map((segment, index) => (index === 0 ? segment : `?${segment}`).replace(/~and~/g, '&'))
          .join('');

        window.history.replaceState(null, '', `${location.pathname}${decoded}${location.hash}`);
      }(window.location));
    </script>
  </head>
  <body>
    <div id="engine-boot" role="status">
      <img class="engine-boot__mark" src="/ouroboros-mark.webp" width="168" height="168" alt="" aria-hidden="true" />
      <div class="engine-boot__word">OUROBOROS<small>ENGINE <span data-engine-boot-version></span></small></div>
      <div class="engine-boot__status">
        <div class="engine-boot__bar"><i></i></div>
        <div class="engine-boot__phase">
          <span data-boot-phase="loading">Загрузка</span>
          <span data-boot-phase="building">Сборка сцены</span>
        </div>
      </div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
