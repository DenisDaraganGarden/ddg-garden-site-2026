<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#000000" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start — блок целиком переписывает scripts/seo/build-seo.mjs на каждый
         маршрут при сборке. Правки внутри переживут только dev-сервер. -->
    <title>Denis Daragan Buro — ландшафтная архитектура</title>
    <meta name="description" content="Бюро ландшафтной архитектуры Дениса Дарагана: парки, частные резиденции, сады. Санкт-Петербург." />
    <link rel="canonical" href="https://denisdaragan.com/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Denis Daragan Buro" />
    <meta property="og:locale" content="ru_RU" />
    <meta property="og:title" content="Denis Daragan Buro — ландшафтная архитектура" />
    <meta property="og:description" content="Бюро ландшафтной архитектуры Дениса Дарагана: парки, частные резиденции, сады. Санкт-Петербург." />
    <meta property="og:url" content="https://denisdaragan.com/" />
    <meta property="og:image" content="https://denisdaragan.com/landscape/assets/share-cover.jpg" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->
    <!-- Загрузочный экран редактора. Он лежит здесь, а не в React: браузер рисует
         его первым же кадром, до того как разобраны модули сцены. Флаг ставится
         только на маршруте редактора — сайт грузится как раньше. Анимации идут
         только по transform/opacity, их крутит композитор: сборка сцены надолго
         занимает главный поток, но подвиснуть экрану не может. -->
    <script>
      if (/^\/(en\/)?home\/edit\/?$/.test(window.location.pathname)) {
        document.documentElement.dataset.engineBoot = 'loading';
      }
    </script>
    <style>
      #engine-boot { display: none; }

      html[data-engine-boot] { background: #17191a; overflow: hidden; }

      html[data-engine-boot] #engine-boot {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-content: center;
        justify-items: center;
        gap: 16px;
        background: #17191a;
        color: #dcddd8;
        font: 600 10px/12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 1.8px;
        cursor: progress;
        transition: opacity 0.45s ease;
      }

      html[data-engine-boot="ready"] #engine-boot {
        opacity: 0;
        pointer-events: none;
      }

      #engine-boot svg { width: 44px; height: 44px; }
      #engine-boot circle { fill: none; stroke-width: 1.5; }
      #engine-boot .engine-boot__track { stroke: #353839; }
      #engine-boot .engine-boot__arc {
        stroke: #cfc1a1;
        stroke-linecap: round;
        stroke-dasharray: 28 107;
        transform-origin: 50% 50%;
        animation: engine-boot-spin 1.7s linear infinite;
      }

      #engine-boot .engine-boot__word { text-align: center; }
      #engine-boot small {
        display: block;
        margin-top: 4px;
        font-size: 7px;
        font-weight: 400;
        letter-spacing: 2px;
        color: #989d9e;
      }

      #engine-boot .engine-boot__bar {
        width: 132px;
        height: 1px;
        overflow: hidden;
        background: #353839;
      }
      #engine-boot .engine-boot__bar i {
        display: block;
        height: 100%;
        background: #cfc1a1;
        animation: engine-boot-sweep 1.7s ease-in-out infinite;
      }

      @keyframes engine-boot-spin { to { transform: rotate(360deg); } }
      @keyframes engine-boot-sweep {
        from { transform: translateX(-100%); }
        to { transform: translateX(100%); }
      }

      @media (prefers-reduced-motion: reduce) {
        #engine-boot .engine-boot__arc { animation: none; }
        #engine-boot .engine-boot__bar i { animation: none; opacity: 0.45; }
      }
    </style>
    <script>
      (function routeGitHubPagesFallback(location) {
        if (!location.search.startsWith('?/')) {
          return;
        }

        const decoded = location.search
          .slice(2)
          .split('&')
          .map((segment, index) => (index === 0 ? segment : `?${segment}`).replace(/~and~/g, '&'))
          .join('');

        window.history.replaceState(null, '', `${location.pathname}${decoded}${location.hash}`);
      }(window.location));
    </script>
  </head>
  <body>
    <div id="engine-boot" role="status">
      <svg viewBox="0 0 40 40" aria-hidden="true">
        <circle class="engine-boot__track" cx="20" cy="20" r="17" />
        <circle class="engine-boot__arc" cx="20" cy="20" r="17" />
      </svg>
      <div class="engine-boot__word">OUROBOROS<small>ENGINE</small></div>
      <div class="engine-boot__bar"><i></i></div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
