services:
  postgres:
    image: postgres:16.15-alpine3.24
    container_name: ddg-content-postgres
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${CONTENT_ROOT}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  payload:
    build:
      context: ../../services/content-cms
      dockerfile: Dockerfile
    image: ddg-content-cms:local
    container_name: ddg-content-payload
    restart: unless-stopped
    logging:
      driver: local
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      # Deliberately private. Future SNI vhosts are the only public entrypoints.
      - "${PAYLOAD_BIND_ADDRESS:-127.0.0.1}:${PAYLOAD_PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      PUBLIC_MEDIA_ORIGIN: ${PUBLIC_MEDIA_ORIGIN}
      SITE_ORIGIN: ${SITE_ORIGIN}
      UPLOAD_DIR: /app/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    volumes:
      - ${CONTENT_ROOT}/uploads:/app/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s

  # Run manually before a new Payload image is started in production:
  # docker compose --profile maintenance run --rm payload-migrate
  # It has no published port and never starts with ordinary `up -d`.
  payload-migrate:
    build:
      context: ../../services/content-cms
      dockerfile: Dockerfile
      target: build
    image: ddg-content-cms-migrate:local
    profiles: ["maintenance"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      PUBLIC_MEDIA_ORIGIN: ${PUBLIC_MEDIA_ORIGIN}
      SITE_ORIGIN: ${SITE_ORIGIN}
      UPLOAD_DIR: /app/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    command: ["npm", "run", "migrate"]

  # Run exactly once, while the service is still loopback-only and the users
  # collection is empty:
  # docker compose --profile maintenance run --rm \
  #   -e BOOTSTRAP_ADMIN_EMAIL -e BOOTSTRAP_ADMIN_PASSWORD payload-bootstrap
  payload-bootstrap:
    build:
      context: ../../services/content-cms
      dockerfile: Dockerfile
      target: build
    image: ddg-content-cms-migrate:local
    profiles: ["maintenance"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      PUBLIC_MEDIA_ORIGIN: ${PUBLIC_MEDIA_ORIGIN}
      SITE_ORIGIN: ${SITE_ORIGIN}
      UPLOAD_DIR: /app/uploads
      NEXT_TELEMETRY_DISABLED: "1"
      NODE_ENV: production
    command: ["npm", "run", "bootstrap:admin"]
