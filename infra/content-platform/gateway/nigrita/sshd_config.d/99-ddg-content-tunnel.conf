# Template for /etc/ssh/sshd_config.d/99-ddg-content-tunnel.conf on nigrita.
# Validate with `sshd -t` before reload. The account is used exclusively for
# one reverse forward, requested by ddg-bridge-01.
Match User ddg-content-tunnel
    AuthenticationMethods publickey
    PasswordAuthentication no
    KbdInteractiveAuthentication no
    PubkeyAuthentication yes
    AllowTcpForwarding remote
    GatewayPorts no
    PermitTTY no
    X11Forwarding no
    AllowAgentForwarding no
    PermitOpen none
    PermitListen 127.0.0.1:18055
